# Frozen architecture-paper comparison contract. Physical reports remain the
# source of measured values; synthetic masks are used only for controlled
# sensitivity projections calibrated from the physical mask suite.
schema_version: 1
experiment_id: sparse_accelerator_paper_v1

evidence:
  trained_tile: results/tables/sparse_refinement_trained_tile_physical.json
  variable_region: results/tables/sparse_refinement_variable_region_physical.json
  frame_worklist: results/tables/sparse_frame_worklist_physical.json
  balanced_pipeline: results/tables/sparse_refinement_balanced_pipeline_physical.json
  hierarchical: results/tables/sparse_refinement_hierarchical_physical.json
  hierarchical_suite: results/tables/sparse_hierarchical_mask_suite_physical.json
  mask_lookup_route: results/tables/sparse_mask_lookup_route_comparison.json
  independent_worklists: results/tables/sparse_independent_worklists_joined.json
  independent_worklists_physical: results/tables/sparse_independent_worklists_physical.json
  multicontext_issue: results/tables/sparse_multicontext_issue_gate.json
  canonical_mask_manifest: fpga/generated/sparse_refinement_accelerator_v1/hierarchical_mask_board/manifest.json

geometry:
  lr_width: 640
  lr_height: 360
  scale: 2
  tile_width: 64
  tile_height: 60
  tile_rows: 6
  tile_columns: 10
  layer_radii: [2, 1, 0]
  input_radius: 3

sweep:
  selected_tile_counts: [1, 6, 15, 30, 45]
  shapes: [clustered, horizontal, vertical, checker, random]
  random_seed: 20260806
  moving_cluster_width_tiles: 3
  moving_cluster_height_tiles: 2

mask_encoding:
  bitmap_bytes: 8
  row_span_descriptor_bytes: 4

acceptance:
  selected_output_exact_required: true
  minimum_cycles_vs_region_percent: 25.0
  minimum_axis_bytes_vs_region_percent: 25.0
  minimum_physical_mask_patterns: 16
  minimum_physical_sources: 3
  minimum_decoder_logic_lut_reduction_percent: 1.0
  realtime_fps: 30.0

excluded_claims:
  - deployable_selector_generalization
  - physical_energy_without_external_meter
  - realtime_720p_when_measured_service_exceeds_deadline
  - synthetic_sweep_as_physical_measurement
