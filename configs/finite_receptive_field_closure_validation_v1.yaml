# Experiment 127: deterministic second-topology closure validation.
experiment_id: finite_receptive_field_closure_validation_v1
numeric_experiment_id: 127
schema_version: 1
status: completed_deterministic_software_contract

purpose: >-
  Test whether reverse support closure, selected-output exactness, and
  structural minimality transfer from the sequential ESPCN graph to a second
  finite-receptive-field topology without using image data or hardware builds.

grid:
  width: 11
  height: 9

# The graph contains a dilated path and an identity skip that merge before a
# final convolution. Each edge names its exact discrete spatial support; radius
# records only the largest Chebyshev displacement.
topology:
  nodes:
    - input
    - conv_a
    - conv_b_dilated
    - residual_add
    - output
  edges:
    - predecessor: input
      successor: conv_a
      radius: 1
      support: square_3x3
    - predecessor: conv_a
      successor: conv_b_dilated
      radius: 2
      support: dilated_3x3_d2
    - predecessor: conv_b_dilated
      successor: residual_add
      radius: 0
      support: pointwise
    - predecessor: input
      successor: residual_add
      radius: 0
      support: pointwise
    - predecessor: residual_add
      successor: output
      radius: 1
      support: square_3x3
  topological_order:
    - input
    - conv_a
    - conv_b_dilated
    - residual_add
    - output

patterns:
  - center_singleton
  - corner_singleton
  - opposite_corners
  - fragmented_triplet
  - center_block
  - edge_band
  - checkerboard_sparse
  - full_output

acceptance:
  exact_pattern_count: 8
  closure_matches_exhaustive_support_paths: true
  selected_outputs_match_dense_integer_reference: true
  every_required_input_has_removal_witness: true
  maximum_expected_input_radius: 4
  required_attained_input_output_radius: 4
  global_operator_present: false

evidence_boundary:
  synthetic_integer_inputs_only: true
  sealed_or_renderer_images_used: false
  selector_tuned: false
  rtl_simulation_claimed: false
  routed_hardware_claimed: false
  physical_validation_claimed: false
  formal_verification_claimed: false

outputs:
  json: results/tables/finite_receptive_field_closure_validation_v1.json
  markdown: results/tables/finite_receptive_field_closure_validation_v1.md
